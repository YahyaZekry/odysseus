# Supply-chain review
#
# Purpose: defend against "side-chain" / supply-chain attacks -- a pull request
# that adds (or bumps) a dependency to a version with a known vulnerability or a
# disallowed license. Two layers:
#
#   - dependency-review: runs ONLY on pull requests. It compares the
#     dependencies before and after the PR and blocks the merge if the change
#     pulls in a package with a known security advisory. This is the gate.
#   - pip-audit: scans the project's current Python requirements against the
#     advisory database. Advisory only (it never blocks a merge), because it can
#     flag a pre-existing issue in an already-shipped dependency.

name: Dependency review

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Default-deny token; jobs grant only read access.
permissions: {}

concurrency:
  group: dependency-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: dependency-review (PR gate)
    # Only meaningful on a pull request -- it needs a base..head diff to review.
    # dependency-review-action requires GitHub dependency-review support.
    # Keep the blocking gate on the canonical repository; forks and maintainer
    # preview mirrors still run the advisory pip-audit job below.
    if: github.event_name == 'pull_request' && github.repository == 'odysseus-dev/odysseus'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          # Fail the PR on any newly introduced moderate-or-worse advisory.
          fail-on-severity: moderate

  pip-audit:
    name: pip-audit (advisory)
    runs-on: ubuntu-latest
    # Advisory: report known-vulnerable Python deps without blocking the merge.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Run pip-audit on requirements
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates
          python scripts/check_ca_trust.py --system
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r requirements-bootstrap.txt
          pip install pip-audit==2.10.0
          # fastembed 0.9.0 (core local-embeddings dependency) declares
          # `pillow<13`, so the resolver can only pick Pillow 12.3.0. All 24
          # advisories below are fixed in Pillow 13.0.0, which cannot be
          # installed until fastembed widens that cap. The list grew from 8
          # to 24 on 2026-10-21; this is now the main dependency risk. Remove
          # these ignores (and the Pillow <13 pin in requirements.txt) as
          # soon as fastembed allows Pillow 13, or decouple local embeddings
          # from fastembed so the pin can be dropped.
          pip-audit -r requirements.txt -r requirements-optional.txt --strict \
            --ignore-vuln CVE-2026-112390 \
            --ignore-vuln CVE-2026-112391 \
            --ignore-vuln CVE-2026-112392 \
            --ignore-vuln CVE-2026-112393 \
            --ignore-vuln CVE-2026-112395 \
            --ignore-vuln CVE-2026-112396 \
            --ignore-vuln CVE-2026-112397 \
            --ignore-vuln CVE-2026-112399 \
            --ignore-vuln CVE-2026-112400 \
            --ignore-vuln CVE-2026-112401 \
            --ignore-vuln CVE-2026-112402 \
            --ignore-vuln CVE-2026-112404 \
            --ignore-vuln CVE-2026-112405 \
            --ignore-vuln CVE-2026-112406 \
            --ignore-vuln CVE-2026-112891 \
            --ignore-vuln CVE-2026-112892 \
            --ignore-vuln CVE-2026-112893 \
            --ignore-vuln CVE-2026-112894 \
            --ignore-vuln CVE-2026-112895 \
            --ignore-vuln CVE-2026-112896 \
            --ignore-vuln CVE-2026-112897 \
            --ignore-vuln CVE-2026-112899 \
            --ignore-vuln CVE-2026-112900 \
            --ignore-vuln CVE-2026-112901
