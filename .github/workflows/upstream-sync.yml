name: upstream sync check

# Checks odysseus-dev/odysseus (the actively-maintained project this fork
# tracks) for new commits on `dev` that this repo's `dev` doesn't have yet.
# If there's anything new, (re)creates a single persistent branch/PR with
# the merge already attempted:
#   - clean merge  -> PR is ready to review and merge as-is
#   - conflicts    -> PR is opened as a draft with conflict markers committed,
#                     so resolving them is a normal "check out this branch
#                     and fix it" task instead of starting from scratch.
# Re-runs always start the branch fresh from the current dev + a fresh
# fetch of upstream, so the PR never goes stale while it sits unmerged.
#
# Upstream's .github/workflows/ changes are pushed when the sync token has
# `workflow` scope, and dropped only when it doesn't -- the push is attempted
# for real and the fallback runs off the actual rejection, so the sync neither
# dies on a missing scope nor silently withholds workflow files that upstream
# tests depend on. Anything the fallback leaves behind is listed on the PR.
#
# PR creation via the default GITHUB_TOKEN is blocked by a GitHub-side
# guardrail even with "Allow GitHub Actions to create and approve pull
# requests" enabled on this repo (observed, not just documented — three
# runs failed identically with "Resource not accessible by integration
# (createPullRequest)" after enabling it). Uses a fine-grained PAT stored
# as the SYNC_PR_TOKEN secret instead (repo-scoped to this repo only,
# Contents: read/write + Pull requests: read/write). Falls back to the
# default token if the secret isn't set, which will hit the same error
# until SYNC_PR_TOKEN is added.

on:
  schedule:
    - cron: '0 6 * * *'  # daily, 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: upstream-sync-check
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/odysseus-dev/odysseus.git
  UPSTREAM_BRANCH: dev
  SYNC_BRANCH: upstream-sync

jobs:
  check-and-sync:
    name: check upstream, open/update sync PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.SYNC_PR_TOKEN || github.token }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream "$UPSTREAM_BRANCH" --quiet

      - name: Check for new upstream commits
        id: diff
        run: |
          count=$(git rev-list --count "HEAD..upstream/${UPSTREAM_BRANCH}")
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "$count new upstream commit(s)"

      - name: Attempt merge on a fresh sync branch
        if: steps.diff.outputs.count != '0'
        id: merge
        run: |
          base=$(git rev-parse HEAD)
          git branch -f "$SYNC_BRANCH" HEAD
          git checkout "$SYNC_BRANCH"
          if git merge "upstream/${UPSTREAM_BRANCH}" --no-edit; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
            # Conflicts are left as-is (markers included) and committed, so
            # the branch is a normal starting point for manual resolution.
            git add -A
            git commit -m "Merge upstream/${UPSTREAM_BRANCH} (has conflicts, needs manual resolution)"
          fi

          echo "base=$base" >> "$GITHUB_OUTPUT"

      # Pushing a branch that touches .github/workflows/ needs a token with
      # `workflow` scope. Without it the push is rejected and the whole sync
      # dies at this step -- that took the sync down daily from 2026-08-18 to
      # 2026-08-23 over one upstream edit to pr-description-check.yml.
      #
      # Dropping workflow files unconditionally (the previous approach) traded
      # that outage for a quieter, worse failure: upstream tests that assert a
      # workflow exists or has certain contents then fail on the sync PR, and
      # a genuinely new file like deploy-pages.yml never arrives at all. On
      # 2026-08-30 that silently withheld 11 of them.
      #
      # So try the real push first and only fall back when the token actually
      # refuses. When the token has the scope this is a plain push; when it
      # doesn't, the sync still lands everything outside .github/workflows/
      # and the PR lists what it had to leave behind.
      - name: Push sync branch
        if: steps.diff.outputs.count != '0'
        id: push
        env:
          BASE: ${{ steps.merge.outputs.base }}
        run: |
          if err=$(git push origin "$SYNC_BRANCH" --force 2>&1); then
            echo "$err"
            exit 0
          fi
          echo "$err"

          # Only the workflow-scope guardrail is recoverable here. Anything
          # else (a protected branch, a network error, a revoked token) must
          # still fail loudly rather than be papered over.
          case "$err" in
            *"without \`workflow\` scope"*) ;;
            *) echo "::error::push failed for a reason other than workflow scope"; exit 1 ;;
          esac

          echo "::warning::Token lacks \`workflow\` scope; retrying without upstream's .github/workflows changes"
          skipped=$(git diff --name-only "$BASE" HEAD -- .github/workflows/)
          rm -rf .github/workflows
          git checkout "$BASE" -- .github/workflows
          git add -A .github/workflows
          git diff --cached --quiet || \
            git commit -m "Keep this fork's .github/workflows (upstream changes skipped)"
          git push origin "$SYNC_BRANCH" --force

          {
            echo "skipped<<SKIPPED_EOF"
            echo "$skipped"
            echo "SKIPPED_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open or update PR
        if: steps.diff.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.SYNC_PR_TOKEN || github.token }}
          CLEAN: ${{ steps.merge.outputs.clean }}
          COUNT: ${{ steps.diff.outputs.count }}
          SKIPPED: ${{ steps.push.outputs.skipped }}
        # Uses the REST API (gh api) rather than `gh pr create`/`gh pr edit`,
        # which go through GraphQL's createPullRequest mutation -- that
        # mutation rejects fine-grained PATs with "Resource not accessible"
        # even when the token has full Contents + Pull requests read/write,
        # a known gap in fine-grained PAT support on the GraphQL API. The
        # REST endpoint works fine with the same token/permissions.
        run: |
          if [ "$CLEAN" = "true" ]; then
            title="Sync with upstream ($COUNT commit(s))"
            body="Clean merge of \`upstream/${UPSTREAM_BRANCH}\` ($COUNT new commit(s)). Ready to review and merge."
            draft=false
          else
            title="Sync with upstream ($COUNT commit(s)) — has conflicts"
            body="Merge of \`upstream/${UPSTREAM_BRANCH}\` ($COUNT new commit(s)) has unresolved conflicts, committed with markers intact. Check out \`$SYNC_BRANCH\` and resolve them, then push fixes to this same branch."
            draft=true
          fi

          if [ -n "$SKIPPED" ]; then
            # $SKIPPED is a newline-separated path list, so the split is wanted here.
            # shellcheck disable=SC2086
            list=$(printf -- "- \`%s\`\n" $SKIPPED)
            note="**Workflow files not synced.** The sync token has no \`workflow\` permission, so these upstream changes to \`.github/workflows/\` were left out and this fork's copies kept:"
            body=$(printf '%s\n\n---\n\n%s\n\n%s\n\nApply them by hand if you want them.' \
              "$body" "$note" "$list")
          fi

          existing_pr=$(gh api "repos/${{ github.repository }}/pulls?head=${{ github.repository_owner }}:${SYNC_BRANCH}&base=dev&state=open" --jq '.[0].number // empty')
          if [ -n "$existing_pr" ]; then
            gh api "repos/${{ github.repository }}/pulls/${existing_pr}" -X PATCH -f title="$title" -f body="$body"
          else
            gh api "repos/${{ github.repository }}/pulls" -X POST -f title="$title" -f body="$body" -f head="$SYNC_BRANCH" -f base=dev -F draft="$draft"
          fi
